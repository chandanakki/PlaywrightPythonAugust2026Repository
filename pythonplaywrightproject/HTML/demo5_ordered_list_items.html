<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>
<body>
<h3>Ordered List Items</h3>
<ol>
<li>Mango</li>
<li>Orange</li>
<li>Apple</li>
<li>Banana</li>
</ol>
<hr>
<ol type="A">
<li>Mango</li>
<li>Orange</li>
<li>Apple</li>
<li>Banana</li>
</ol>
<hr>
<ol type="a">
<li>Mango</li>
<li>Orange</li>
<li>Apple</li>
<li>Banana</li>
</ol>
<hr>
<ol type="I">
<li>Mango</li>
<li>Orange</li>
<li>Apple</li>
<li>Banana</li>
</ol>
<hr>
<ol type="i">
<li>Mango</li>
<li>Orange</li>
<li>Apple</li>
<li>Banana</li>
</ol>
<hr>
</body>
</html>
