<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<script>
        function showEven(){
            for(let i=10;i<=30;i++){
                document.write("Even Number :"+i+"<br>")
            }
        }
</script>
</head>
<body>
<h3>Display Evens on Web Page</h3>
<button onmouseover="showEven()">Execute Code</button>
</body>
</html>
