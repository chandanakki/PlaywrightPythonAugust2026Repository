<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>
<body>
<h3>Information</h3>
<fieldset>
<legend>Information</legend>
<form action="">
            First Name:
<input type="text" name="fn" placeholder="First Name" required>
<br>
<br>
            Middle Name:
<input type="text" name="mn" value="Mysore" readonly>
<br>
<br>
            Last Name:
<input type="text" name="ln" disabled>
<br>
<br>
            Description:
<input type="text" id="desc" maxlength="8">
<br>
<br>
            Age:
<input type="number" name="age" min="18" max="60">
<br>
<br>
            Range:
<input type="range" name="range">
<br>
<br>
<input type="submit" name="Submit">
<input type="reset" name="Reset">
</form>
</fieldset>
</body>
</html>
