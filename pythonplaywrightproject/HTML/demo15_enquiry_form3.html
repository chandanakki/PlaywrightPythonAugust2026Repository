<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>
<body>
<h3>Enquiry Form</h3>
 
    <fieldset>
<legend>Enquiry</legend>
<form action="">
        First Name:
<input type="text" name="firstname">
<br>
<br>
        Last Name:
<input type="text" name="lastname">
<br>
<br>
        Description:
<textarea name="desc"></textarea>
<br>
<br>
        Gender:
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female
<br>
<br>
        Hobbies:
<input type="checkbox" name="hobbies[]">Reading
<input type="checkbox" name="hobbies[]">Writing
<input type="checkbox" name="hobbies[]">Swimming
<br>
<br>
        Country:
<select name="country">
<option value="ps">Please Select</option>
<option value="am">America</option>
<option value="br">Brazil</option>
<option value="gm">Germany</option>
<option value="fr">Frame</option>
<option value="ind">India</option>
<option value="sl">Srilanka</option>
<option value="jp">Japan</option>
</select>
<br>
<br>
        Image Upload:
<input type="file" name="upload">
<br>
<br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</form>
</fieldset>
</body>
</html>
